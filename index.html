<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe6" />
  <title>You're Invited</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="stage" aria-label="Wedding invitation">
    <div class="envelope">
      <div class="envelope-back" aria-hidden="true"></div>
      <div class="invitation"></div>
      <div class="envelope-front" aria-hidden="true"></div>
      <div class="envelope-flap" aria-hidden="true"></div>
    </div>

    <div class="deck-nav" role="tablist" aria-label="Invitations" hidden></div>

    <a class="cta" href="#" target="_blank" rel="noopener">Visit our wedding site</a>
  </main>

  <script src="main.js" defer></script>
</body>
</html>
